<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시작 페이지</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 왼쪽 상단: 서울디지털대학교 홈페이지 링크 -->
  <header class="top-bar">
    <a href="https://www.sdu.ac.kr/" target="_blank" class="sdu-link">
      <span class="sdu-mark">SDU</span> 서울디지털대학교
    </a>

    <!-- 오른쪽 상단: 오늘의 날씨 (서울, 제주) -->
    <div class="weather-area">
      <div id="weather-seoul" class="weather-box">서울 날씨 불러오는 중...</div>
      <div id="weather-jeju" class="weather-box">제주 날씨 불러오는 중...</div>
    </div>
  </header>

  <!-- 가운데: 구글 검색창 -->
  <main class="center">
    <form action="https://www.google.com/search" method="GET" class="search-form" id="search-form">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" name="q" id="search-input" class="search-input" placeholder="Google 검색" autocomplete="off" autofocus>
      </div>
      <div class="search-buttons">
        <button type="submit" class="g-btn">Google 검색</button>
        <button type="button" class="g-btn" id="lucky-btn">I'm Feeling Lucky</button>
      </div>
    </form>
  </main>

  <!-- 아래: 오늘의 명언 -->
  <footer class="bottom-bar">
    <p id="quote" class="quote">명언 불러오는 중...</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
